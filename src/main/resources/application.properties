# ===================================================================
# Spring Boot Configuration - Ecom Electronics Backend
# ===================================================================
spring.application.name=Ecom-Electronics
server.port=8080

# -------------------------------------------------------------------
# MySQL Database Configuration (Production / Standard Setup)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/ecom_electronics_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA & Hibernate Properties
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Fallback / H2 Console Settings (Enable for easy testing)
# -------------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JSON Format & Logging
spring.jackson.serialization.indent_output=true
logging.level.com.ecom.electronics=DEBUG
