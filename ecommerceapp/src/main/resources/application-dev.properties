# ===============================
# DATABASE CONFIGURATION
# Defaults to persistent local H2 database, with full support for MySQL via environment variables.
# ===============================

spring.datasource.url=${DB_URL:jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================

spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===============================
# JWT CONFIGURATION
# ===============================

jwt.secret=my-super-secret-key-for-ecommerce-application-must-be-at-least-32-bytes
jwt.expiration=86400000

# ===============================
# SERVER & ACTUATOR CONFIGURATION
# ===============================

server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info